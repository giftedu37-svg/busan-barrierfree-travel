<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>휠웨이 부산 | 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--blue:#0A74B0;--turquoise:#16B8C4;--ink:#16445A;--coral:#FF806B}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}
    #map{width:100%;height:100%}.toolbar{position:fixed;z-index:1000;top:16px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}.toolbar>*{pointer-events:auto}.title{background:#fff;border-radius:16px;padding:11px 15px;box-shadow:0 5px 16px #16445a25;font-weight:800}.locate{border:0;border-radius:14px;padding:12px 15px;background:var(--coral);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #d96555}.locate:focus{outline:3px solid #16B8C466;outline-offset:2px}.status{position:fixed;z-index:1000;bottom:18px;left:18px;right:18px;background:#fff;max-width:420px;border-radius:14px;padding:10px 13px;box-shadow:0 5px 16px #16445a22;font-size:13px}.leaflet-popup-content{line-height:1.6}
    .title{position:fixed;right:18px;bottom:18px;z-index:1001}
    .locate{position:fixed;top:16px;right:16px;z-index:1001}
    @media(max-width:700px){.title{right:12px;bottom:12px;font-size:13px;padding:9px 12px}}
  </style>
</head>
<body>
  <style>.route-box{position:fixed;z-index:1000;top:74px;left:16px;width:min(380px,calc(100% - 32px));background:#fff;border-radius:16px;padding:12px;box-shadow:0 5px 16px #16445a25}.route-box input{width:100%;padding:10px;border:1px solid #c9e8ec;border-radius:10px;margin:4px 0;color:var(--ink)}.route-btn,.voice-btn{width:100%;border:0;border-radius:11px;padding:10px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.voice-btn{background:#16B8C4}.voice-btn.listening{background:#FF806B;animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(.98);opacity:.82}}.guide-btn{margin-top:8px;border:1px solid #b6dfe6;border-radius:11px;padding:9px 12px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer}.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.mode-tab{border:1px solid #b6dfe6;border-radius:10px;padding:8px 4px;background:#f6fdfe;color:var(--ink);font-size:12px;font-weight:800;cursor:pointer}.mode-tab[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.transport-info{margin-top:9px;padding:10px;border-radius:11px;background:#eefafd;color:var(--ink);font-size:12px;line-height:1.5}.transport-info b{display:block;color:#0A74B0}.transport-info a{color:#075A88;font-weight:800}</style>
  <div class="route-box" aria-label="경로 입력" lang="ko"><input id="start" type="text" lang="ko" inputmode="text" autocomplete="off" placeholder="출발지 (예: 부산역)"><input id="end" type="text" lang="ko" inputmode="text" autocomplete="off" placeholder="도착지 (예: SEA LIFE 부산아쿠아리움)"><button class="voice-btn" id="voiceRoute" type="button">🎙 음성으로 출발지·목적지 말하기</button><small>예: “부산역에서 태종대 유원지까지 저상버스로 가는 길”</small><div class="mode-tabs" aria-label="이동수단 선택"><button class="mode-tab" type="button" data-mode="rail" aria-pressed="true">🚇 도시철도</button><button class="mode-tab" type="button" data-mode="bus" aria-pressed="false">🚌 저상버스</button><button class="mode-tab" type="button" data-mode="taxi" aria-pressed="false">🚕 두리발</button></div><button class="route-btn" id="routeBtn">선택한 수단으로 경로 보기</button><button class="guide-btn" id="voiceGuide" type="button">🔊 예상 경로 안내 듣기</button><div class="transport-info" id="transportInfo"><b>🚇 도시철도 경로</b>출발지와 목적지를 입력하면 환승 안내를 보여드립니다.</div></div>
  <div class="toolbar"><div class="title">♿ 휠웨이 부산 지도</div><button class="locate" id="locate">현재 위치 사용</button></div>
  <div id="map" aria-label="부산 무장애 관광 지도"></div>
  <div class="status" id="status" role="status">지도를 불러왔습니다. 현재 위치 사용 버튼을 눌러보세요.</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const busan=[35.1587,129.1604];
    const map=L.map('map').setView(busan,12);
    map.setMaxBounds([[32,123],[44,132.5]]);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
    L.control.scale({imperial:true,metric:true}).addTo(map);
    const places=[
      ['SEA LIFE 부산아쿠아리움',35.1601,129.1602,'https://www.visitsealife.com/busan/'],
      ['송도해수욕장·스카이워크',35.0762,129.0177,'https://www.busan.go.kr/'],
      ['국립수산과학관',35.3227,129.2464,'https://www.sci.or.kr/'],
      ['태종대 유원지',35.0516,129.0877,'https://www.bisco.or.kr/taejongdae/'],
      ['더베이101',35.1569,129.1529,'https://www.thebay101yacht.com/']
    ];
    places.forEach(([name,lat,lng,site])=>L.marker([lat,lng]).addTo(map).bindPopup(`<b>${name}</b><br><a href="${site}" target="_blank" rel="noopener">공식 사이트 열기</a>`));
    let marker,accuracyCircle,watchId,routeLine,lastGuide='출발지와 목적지를 입력한 뒤 경로 보기를 눌러주세요.';
    let transportMode='rail';
    const status=document.getElementById('status');
    const modeDetails={
      rail:{title:'🚇 도시철도 경로',color:'#0A74B0',text:'도시철도 이동 후 목적지 인근의 엘리베이터 출구와 보행 연결을 확인합니다.'},
      bus:{title:'🚌 저상버스 경로',color:'#16B8C4',text:'저상버스 운행 노선을 우선 안내합니다. 실제 저상버스 배차와 휠체어 탑승 가능 여부는 출발 전에 확인하세요.'},
      taxi:{title:'🚕 두리발 콜택시 경로',color:'#FF806B',text:'환승 부담이 큰 구간의 두리발 대체 이동 안내입니다. <a href="https://duribal.co.kr/" target="_blank" rel="noopener">두리발 예약·이용 안내 ↗</a>'}
    };
    function updateTransportInfo(){const detail=modeDetails[transportMode];document.getElementById('transportInfo').innerHTML=`<b>${detail.title}</b>${detail.text}`;}
    document.querySelectorAll('.mode-tab').forEach(button=>button.addEventListener('click',()=>{transportMode=button.dataset.mode;document.querySelectorAll('.mode-tab').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));updateTransportInfo();}));
    document.getElementById('routeBtn').addEventListener('click',async()=>{const start=document.getElementById('start').value.trim(),end=document.getElementById('end').value.trim(),detail=modeDetails[transportMode];if(!start||!end){status.textContent='출발지와 도착지를 입력해주세요.';return;}status.textContent=`${detail.title}를 기준으로 경로를 계산하는 중입니다...`;try{const [a,b]=await Promise.all([geocode(start),geocode(end)]);if(!a||!b)throw new Error('place');const routeUrls=[`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`,`https://routing.openstreetmap.de/routed-car/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`];let data=null;for(const u of routeUrls){try{const res=await fetch(u);if(res.ok){const candidate=await res.json();if(candidate.code==='Ok'){data=candidate;break;}}}catch(_){} }if(!data)throw new Error('route');if(routeLine)map.removeLayer(routeLine);routeLine=L.geoJSON(data.routes[0].geometry,{style:{color:detail.color,weight:6,opacity:.85}}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[40,40]});const distance=(data.routes[0].distance/1000).toFixed(1),minutes=Math.round(data.routes[0].duration/60),notice=transportMode==='rail'?'역 엘리베이터 및 막차 정보는 출발 전 확인하세요.':transportMode==='bus'?'저상버스 운행 여부를 출발 전 확인하세요.':'두리발은 사전 예약이 필요할 수 있습니다.';lastGuide=`${detail.title}. ${start}에서 ${end}까지 약 ${distance}킬로미터, 도로 기준 약 ${minutes}분입니다. ${notice}`;status.innerHTML=`<b>${detail.title}</b><br>${start} → ${end} · 약 ${distance}km · 도로 기준 ${minutes}분<br><small>${notice}</small>`;}catch(e){status.textContent=e.message==='place'?'입력한 장소의 좌표를 찾지 못했습니다.':'경로 서버가 응답하지 않습니다. 잠시 후 다시 시도해주세요.';}});
    const stations={'부산역':{lat:35.1151,lon:129.0414},'서면역':{lat:35.1579,lon:129.0595},'해운대역':{lat:35.1631,lon:129.1588},'남포역':{lat:35.0979,lon:129.0345},'센텀시티역':{lat:35.1690,lon:129.1324},'광안역':{lat:35.1532,lon:129.1187}};
    async function geocode(query){const normalized=query.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');const key=query.replace(/역?\s*$/,'역');if(stations[query])return stations[query];if(stations[key])return stations[key];const aliases=[['sealife부산아쿠아리움',['sealife','씨라이프','아쿠아리움'],{lat:35.1601,lon:129.1602}],['송도해수욕장',['송도해수욕장','송도스카이워크','송도'],{lat:35.0762,lon:129.0177}],['태종대',['태종대','태종대유원지'],{lat:35.0516,lon:129.0877}],['더베이101',['더베이101','더베이','thebay101'],{lat:35.1569,lon:129.1529}],['국립수산과학관',['국립수산과학관','수산과학관'],{lat:35.3227,lon:129.2464}],['부산역',['부산역','부산'],{lat:35.1151,lon:129.0414}],['서면역',['서면역','서면'],{lat:35.1579,lon:129.0595}],['해운대역',['해운대역','해운대'],{lat:35.1631,lon:129.1588}],['남포역',['남포역','남포동'],{lat:35.0979,lon:129.0345}]];const found=aliases.find(([,words])=>words.some(w=>normalized.includes(w.replace(/[^\p{L}\p{N}]/gu,''))));if(found)return found[2];const data=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=ko&limit=1&countrycodes=kr&q='+encodeURIComponent(query),{headers:{Accept:'application/json'}}).then(r=>r.json());return data[0]?{lat:Number(data[0].lat),lon:Number(data[0].lon)}:null;}
    function setTransportMode(mode){transportMode=mode;document.querySelectorAll('.mode-tab').forEach(tab=>tab.setAttribute('aria-pressed',String(tab.dataset.mode===mode)));updateTransportInfo();}
    function speak(text){if(!('speechSynthesis' in window)){status.textContent='이 브라우저는 음성 안내를 지원하지 않습니다.';return;}window.speechSynthesis.cancel();const message=new SpeechSynthesisUtterance(text);message.lang='ko-KR';message.rate=.95;window.speechSynthesis.speak(message);}
    document.getElementById('voiceGuide').addEventListener('click',()=>speak(lastGuide));
    document.getElementById('voiceRoute').addEventListener('click',()=>{
      const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!Recognition){status.textContent='음성 인식은 Chrome 또는 Edge에서 사용할 수 있습니다.';return;}
      const button=document.getElementById('voiceRoute'),recognition=new Recognition();
      recognition.lang='ko-KR';recognition.interimResults=false;recognition.maxAlternatives=1;
      recognition.onstart=()=>{button.classList.add('listening');button.textContent='🔴 듣고 있어요… 출발지와 목적지를 말해주세요';status.textContent='예: 부산역에서 태종대 유원지까지 저상버스로 가는 길';};
      recognition.onresult=e=>{const text=e.results[0][0].transcript.replace(/\s/g,'');const known=['국립수산과학관','수산과학관','송도해수욕장','송도스카이워크','태종대유원지','태종대','더베이101','해운대아쿠아리움','씨라이프','SEA LIFE','부산역','서면역','해운대역','남포역'];const matches=known.map(name=>({name,index:text.toLowerCase().indexOf(name.toLowerCase().replace(/\s/g,''))})).filter(item=>item.index>=0).sort((a,b)=>a.index-b.index);if(matches.length<2){status.textContent='출발지와 목적지를 모두 찾지 못했습니다. “부산역에서 태종대까지”처럼 말해주세요.';return;}document.getElementById('start').value=matches[0].name;document.getElementById('end').value=matches[matches.length-1].name;if(/저상버스|버스/.test(text))setTransportMode('bus');else if(/두리발|콜택시/.test(text))setTransportMode('taxi');else if(/지하철|도시철도/.test(text))setTransportMode('rail');status.textContent=`음성 인식: ${matches[0].name} → ${matches[matches.length-1].name}`;document.getElementById('routeBtn').click();};
      recognition.onerror=()=>{status.textContent='음성을 인식하지 못했습니다. 마이크 권한을 허용한 뒤 다시 시도해주세요.';};
      recognition.onend=()=>{button.classList.remove('listening');button.textContent='🎙 음성으로 출발지·목적지 말하기';};recognition.start();
    });
    if(new URLSearchParams(location.search).get('voice')==='1'){
      setTimeout(()=>document.getElementById('voiceRoute').click(),350);
    }
    document.getElementById('locate').addEventListener('click',async()=>{
      try{if(navigator.permissions){const permission=await navigator.permissions.query({name:'geolocation'});if(permission.state==='denied'){showPermissionHelp();return;}}}catch(_){/* permissions API 미지원 브라우저는 아래 요청을 직접 실행 */}
      if(!navigator.geolocation){status.textContent='이 브라우저는 위치 기능을 지원하지 않습니다.';return;}
      status.textContent='위치 권한을 요청하는 중입니다...';
      map.locate({setView:true,maxZoom:16,watch:true,enableHighAccuracy:true,maximumAge:5000,timeout:10000});
      return;
      if(watchId!==undefined) navigator.geolocation.clearWatch(watchId);
      watchId=navigator.geolocation.watchPosition(pos=>{
        const here=[pos.coords.latitude,pos.coords.longitude];
        if(!marker) marker=L.marker(here).addTo(map).bindPopup('현재 위치'); else marker.setLatLng(here);
        marker.openPopup();map.setView(here,15);status.textContent=`현재 위치: ${here[0].toFixed(5)}, ${here[1].toFixed(5)}`;
      },err=>{status.textContent=err.code===1?'위치 권한이 거부되었습니다. 브라우저 설정에서 허용해주세요.':'현재 위치를 가져오지 못했습니다.';},{enableHighAccuracy:true,maximumAge:5000,timeout:10000});
    });
    function showPermissionHelp(){status.innerHTML='위치 권한이 차단되어 있습니다. 주소창 왼쪽의 <b>사이트 정보/자물쇠 아이콘</b> → <b>위치</b> → <b>허용</b>으로 변경한 뒤 아래 버튼을 누르세요.<br><button type="button" id="retryLocation" style="margin-top:7px;border:0;border-radius:8px;padding:7px 10px;background:#0A74B0;color:#fff;font-weight:700;cursor:pointer">권한 변경 후 다시 시도</button>';document.getElementById('retryLocation').addEventListener('click',()=>document.getElementById('locate').click());}
    map.on('locationfound',e=>{if(marker)map.removeLayer(marker);if(accuracyCircle)map.removeLayer(accuracyCircle);marker=L.marker(e.latlng).addTo(map).bindPopup(`현재 위치 · 오차 범위 약 ${Math.round(e.accuracy)}m`).openPopup();accuracyCircle=L.circle(e.latlng,e.accuracy,{color:'#16B8C4',fillColor:'#16B8C4',fillOpacity:.15}).addTo(map);status.textContent=`현재 위치를 반영했습니다. 오차 범위 약 ${Math.round(e.accuracy)}m`;});
    map.on('locationerror',e=>{status.textContent=e.message||'현재 위치를 가져오지 못했습니다.';});
  </script>
</body>
</html>
